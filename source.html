<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stream Failsafe</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas aria-label="Screened video"></canvas>
  <script>
    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d', { alpha: false });
    const frameTimeout = 300;
    let generation = 0;
    let lastFrame = 0;

    function blackout() {
      generation += 1;
      lastFrame = 0;
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);
    }

    function connect() {
      const socket = new WebSocket(`ws://${location.host}/feed`);
      socket.binaryType = 'arraybuffer';
      socket.onmessage = async ({data}) => {
        if (data === 'black') {
          blackout();
          return;
        }

        const ticket = generation;
        const received = performance.now();
        let frame;
        try {
          frame = await createImageBitmap(new Blob([data], { type: 'image/jpeg' }));
          if (ticket !== generation || performance.now() - received >= frameTimeout) return;
          const width = window.innerWidth;
          const height = window.innerHeight;
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
          }
          const scale = Math.min(width / frame.width, height / frame.height);
          const scaledWidth = frame.width * scale;
          const scaledHeight = frame.height * scale;
          context.fillStyle = '#000';
          context.fillRect(0, 0, width, height);
          context.drawImage(frame, (width - scaledWidth) / 2, (height - scaledHeight) / 2,
                            scaledWidth, scaledHeight);
          lastFrame = received;
        } catch {
          blackout();
        } finally {
          frame?.close();
          if (socket.readyState === WebSocket.OPEN) socket.send('ready');
        }
      };
      socket.onerror = blackout;
      socket.onclose = () => {
        blackout();
        window.setTimeout(connect, 500);
      };
    }

    window.setInterval(() => {
      if (lastFrame && performance.now() - lastFrame >= frameTimeout) blackout();
    }, 15);
    blackout();
    connect();
  </script>
</body>
</html>
